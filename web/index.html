<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>HK Surge Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      height: 100dvh;
    }

    #map { width: 100%; height: 100dvh; }

    /* ── Top Bar ── */
    #topbar {
      position: absolute;
      top: 16px; left: 16px; right: 16px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    #topbar > * { pointer-events: auto; }

    .chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(0,0,0,0.82);
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
      backdrop-filter: blur(8px);
    }

    .dot-blue {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #276EF1;
      flex-shrink: 0;
    }

    #title-chip { font-weight: 700; font-size: 14px; }

    #refresh-chip {
      cursor: pointer;
      transition: background 0.15s;
    }
    #refresh-chip:hover { background: rgba(40,40,40,0.9); }
    #refresh-chip .icon { font-size: 14px; line-height: 1; }
    #refresh-chip span { color: rgba(255,255,255,0.65); font-size: 11px; }

    .spacer { flex: 1; }

    #settings-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: rgba(0,0,0,0.82);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      backdrop-filter: blur(8px);
      transition: background 0.15s;
    }
    #settings-btn:hover { background: rgba(40,40,40,0.9); }

    /* ── Spinner ── */
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(39,110,241,0.3);
      border-top-color: #276EF1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Legend ── */
    #legend {
      position: absolute;
      bottom: 110px; left: 16px;
      z-index: 1000;
      background: rgba(0,0,0,0.82);
      border-radius: 12px;
      padding: 10px 12px;
      backdrop-filter: blur(8px);
    }
    #legend h4 {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: #fff;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .legend-row:last-child { margin-bottom: 0; }
    .legend-dot {
      width: 12px; height: 12px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .legend-row span { font-size: 11px; color: rgba(255,255,255,0.65); }

    /* ── Timestamp ── */
    #timestamp {
      position: absolute;
      bottom: 68px;
      left: 50%; transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0,0,0,0.65);
      border-radius: 12px;
      padding: 4px 12px;
      font-size: 11px;
      color: rgba(255,255,255,0.38);
      white-space: nowrap;
      backdrop-filter: blur(6px);
    }

    /* ── Detail Card ── */
    #detail-card {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 1001;
      padding: 0 16px 20px;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    #detail-card.visible { transform: translateY(0); }
    .card-inner {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1.5px solid transparent;
      box-shadow: 0 0 24px rgba(0,0,0,0.6);
    }
    .surge-circle {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 2px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 700;
    }
    .card-info { flex: 1; }
    .card-info .cn { font-size: 16px; font-weight: 700; }
    .card-info .en { font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 1px; }
    .surge-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 5px;
    }
    #card-close {
      background: none;
      border: none;
      color: rgba(255,255,255,0.45);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      flex-shrink: 0;
    }
    #card-close:hover { color: rgba(255,255,255,0.8); }

    /* ── Settings Modal ── */
    #settings-overlay {
      position: absolute;
      inset: 0;
      z-index: 2000;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: flex-end;
      backdrop-filter: blur(4px);
    }
    #settings-overlay.open { display: flex; }
    #settings-sheet {
      width: 100%;
      background: #1a1a1a;
      border-radius: 20px 20px 0 0;
      padding: 24px 24px 32px;
    }
    #settings-sheet h3 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    #settings-sheet .close-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    #settings-sheet .close-row button {
      background: none; border: none;
      color: rgba(255,255,255,0.45);
      font-size: 20px; cursor: pointer;
    }
    .section-label {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .interval-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .interval-btn {
      padding: 10px 18px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #2c2c2c;
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .interval-btn.active {
      background: #276EF1;
      border-color: #276EF1;
      color: #fff;
      font-weight: 700;
    }
    .disclaimer {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 11px;
      color: rgba(255,255,255,0.28);
      line-height: 1.5;
    }

    /* ── Source badge ── */
    #source-badge {
      position: absolute;
      top: 62px; right: 16px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: rgba(0,0,0,0.78);
      border-radius: 14px;
      font-size: 11px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.08);
      transition: border-color 0.3s;
    }
    #source-badge.live { border-color: rgba(76,175,80,0.5); }
    #source-badge.sim  { border-color: rgba(255,152,0,0.4); }
    #source-badge.err  { border-color: rgba(244,67,54,0.5); }
    .src-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #666;
      flex-shrink: 0;
    }
    .src-dot.live { background: #4CAF50; box-shadow: 0 0 6px #4CAF5088; }
    .src-dot.sim  { background: #FF9800; }
    .src-dot.err  { background: #F44336; }

    /* ── Scrape progress bar ── */
    #progress-bar-wrap {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      z-index: 1002;
      background: rgba(255,255,255,0.06);
      display: none;
    }
    #progress-bar {
      height: 100%;
      background: #276EF1;
      transition: width 0.4s ease;
      width: 0%;
    }

    /* Leaflet overrides */
    .leaflet-control-zoom { display: none; }
    .leaflet-control-attribution {
      background: rgba(0,0,0,0.5) !important;
      color: rgba(255,255,255,0.3) !important;
      font-size: 9px !important;
    }
    .leaflet-control-attribution a { color: rgba(255,255,255,0.4) !important; }
  </style>
</head>
<body>

<!-- Map -->
<div id="map"></div>

<!-- Top Bar -->
<div id="topbar">
  <div class="chip" id="title-chip">
    <div class="dot-blue"></div>
    HK Surge Map
  </div>
  <div class="spacer"></div>
  <div class="chip" id="refresh-chip" onclick="forceRefresh()">
    <div id="refresh-icon" class="icon">↻</div>
    <span id="refresh-label">每60秒更新</span>
  </div>
  <button id="settings-btn" onclick="openSettings()">⚙</button>
</div>

<!-- Data source badge -->
<div id="source-badge" class="sim">
  <div class="src-dot sim" id="src-dot"></div>
  <span id="src-label">模擬數據</span>
</div>

<!-- Scrape progress bar -->
<div id="progress-bar-wrap">
  <div id="progress-bar"></div>
</div>

<!-- Legend -->
<div id="legend">
  <h4>加乘倍數</h4>
  <div class="legend-row"><div class="legend-dot" style="background:#4CAF50"></div><span>&lt; 1.2x &nbsp;正常</span></div>
  <div class="legend-row"><div class="legend-dot" style="background:#8BC34A"></div><span>1.2-1.5x 輕微</span></div>
  <div class="legend-row"><div class="legend-dot" style="background:#FFEB3B"></div><span>1.5-1.8x 中等</span></div>
  <div class="legend-row"><div class="legend-dot" style="background:#FF9800"></div><span>1.8-2.2x 較高</span></div>
  <div class="legend-row"><div class="legend-dot" style="background:#F44336"></div><span>2.2-2.6x 高</span></div>
  <div class="legend-row"><div class="legend-dot" style="background:#880E4F"></div><span>&gt; 2.6x &nbsp;極高</span></div>
</div>

<!-- Timestamp -->
<div id="timestamp">上次更新: --:--:--</div>

<!-- Zone Detail Card -->
<div id="detail-card">
  <div class="card-inner" id="card-inner">
    <div class="surge-circle" id="card-circle">
      <span id="card-multiplier">1.0x</span>
    </div>
    <div class="card-info">
      <div class="cn" id="card-cn">--</div>
      <div class="en" id="card-en">--</div>
      <div class="surge-badge" id="card-badge">--</div>
    </div>
    <button id="card-close" onclick="closeDetail()">✕</button>
  </div>
</div>

<!-- Settings Sheet -->
<div id="settings-overlay" onclick="closeSettingsOutside(event)">
  <div id="settings-sheet">
    <div class="close-row">
      <h3>設定</h3>
      <button onclick="closeSettings()">✕</button>
    </div>
    <div class="section-label">更新頻率</div>
    <div class="interval-options" id="interval-options"></div>
    <div class="disclaimer">
      <span>ℹ</span>
      <span>數據為模擬數據，基於香港各區時段需求規律生成，僅供參考。</span>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Hong Kong 18 Districts ────────────────────────────────────────────────────
const DISTRICTS = [
  { id:'central_western', cn:'中西區', en:'Central & Western',
    center:[22.2839,114.1521],
    poly:[[22.296,114.128],[22.296,114.166],[22.276,114.173],[22.265,114.144],[22.265,114.128]] },
  { id:'wan_chai', cn:'灣仔區', en:'Wan Chai',
    center:[22.2783,114.1827],
    poly:[[22.288,114.166],[22.288,114.199],[22.268,114.201],[22.265,114.173],[22.276,114.173]] },
  { id:'eastern', cn:'東區', en:'Eastern',
    center:[22.2843,114.2264],
    poly:[[22.305,114.199],[22.305,114.244],[22.276,114.244],[22.268,114.201],[22.288,114.199]] },
  { id:'southern', cn:'南區', en:'Southern',
    center:[22.2468,114.1584],
    poly:[[22.265,114.128],[22.265,114.144],[22.276,114.173],[22.268,114.201],[22.276,114.244],[22.23,114.244],[22.21,114.18],[22.21,114.128]] },
  { id:'yau_tsim_mong', cn:'油尖旺區', en:'Yau Tsim Mong',
    center:[22.3126,114.1709],
    poly:[[22.33,114.152],[22.33,114.19],[22.296,114.19],[22.296,114.166],[22.296,114.152]] },
  { id:'sham_shui_po', cn:'深水埗區', en:'Sham Shui Po',
    center:[22.3418,114.1624],
    poly:[[22.358,114.142],[22.358,114.185],[22.33,114.19],[22.33,114.152],[22.33,114.142]] },
  { id:'kowloon_city', cn:'九龍城區', en:'Kowloon City',
    center:[22.3277,114.1918],
    poly:[[22.358,114.185],[22.358,114.215],[22.33,114.215],[22.305,114.199],[22.296,114.19],[22.33,114.19]] },
  { id:'wong_tai_sin', cn:'黃大仙區', en:'Wong Tai Sin',
    center:[22.3508,114.2026],
    poly:[[22.368,114.185],[22.368,114.22],[22.358,114.22],[22.358,114.215],[22.358,114.185]] },
  { id:'kwun_tong', cn:'觀塘區', en:'Kwun Tong',
    center:[22.3165,114.2263],
    poly:[[22.358,114.215],[22.358,114.25],[22.295,114.25],[22.305,114.199],[22.33,114.215]] },
  { id:'tsuen_wan', cn:'荃灣區', en:'Tsuen Wan',
    center:[22.3716,114.1133],
    poly:[[22.42,114.082],[22.42,114.142],[22.358,114.142],[22.33,114.142],[22.31,114.082]] },
  { id:'kwai_tsing', cn:'葵青區', en:'Kwai Tsing',
    center:[22.3636,114.1328],
    poly:[[22.39,114.122],[22.39,114.152],[22.358,114.152],[22.358,114.142],[22.358,114.122]] },
  { id:'tuen_mun', cn:'屯門區', en:'Tuen Mun',
    center:[22.3910,113.9777],
    poly:[[22.43,113.94],[22.43,114.02],[22.37,114.02],[22.35,113.98],[22.35,113.94]] },
  { id:'yuen_long', cn:'元朗區', en:'Yuen Long',
    center:[22.4445,114.0222],
    poly:[[22.5,113.99],[22.5,114.08],[22.43,114.08],[22.43,114.02],[22.43,113.94],[22.46,113.94]] },
  { id:'north', cn:'北區', en:'North',
    center:[22.4942,114.1388],
    poly:[[22.56,114.08],[22.56,114.25],[22.48,114.25],[22.46,114.16],[22.46,114.08],[22.5,114.08]] },
  { id:'tai_po', cn:'大埔區', en:'Tai Po',
    center:[22.4513,114.1645],
    poly:[[22.48,114.16],[22.48,114.25],[22.42,114.25],[22.39,114.20],[22.39,114.16],[22.42,114.16]] },
  { id:'sha_tin', cn:'沙田區', en:'Sha Tin',
    center:[22.3877,114.1956],
    poly:[[22.42,114.16],[22.39,114.16],[22.39,114.20],[22.368,114.22],[22.368,114.185],[22.39,114.152],[22.42,114.142]] },
  { id:'sai_kung', cn:'西貢區', en:'Sai Kung',
    center:[22.3814,114.2709],
    poly:[[22.42,114.25],[22.42,114.44],[22.29,114.44],[22.29,114.25],[22.358,114.25],[22.39,114.20]] },
  { id:'islands', cn:'離島區', en:'Islands',
    center:[22.2612,113.9448],
    poly:[[22.35,113.82],[22.35,114.02],[22.15,114.02],[22.15,113.82]] },
];

// ── Demand profile per district (0–1) ────────────────────────────────────────
const BASE_DEMAND = {
  central_western:0.80, wan_chai:0.85, eastern:0.55, southern:0.40,
  yau_tsim_mong:0.82, sham_shui_po:0.60, kowloon_city:0.65,
  wong_tai_sin:0.55, kwun_tong:0.62, tsuen_wan:0.50, kwai_tsing:0.48,
  tuen_mun:0.42, yuen_long:0.45, north:0.35, tai_po:0.38,
  sha_tin:0.52, sai_kung:0.32, islands:0.28,
};

// ── Colour scale ─────────────────────────────────────────────────────────────
function surgeColor(m) {
  if (m < 1.2) return '#4CAF50';
  if (m < 1.5) return '#8BC34A';
  if (m < 1.8) return '#FFEB3B';
  if (m < 2.2) return '#FF9800';
  if (m < 2.6) return '#F44336';
  return '#880E4F';
}
function surgeOpacity(m) {
  if (m <= 1.0) return 0.15;
  return Math.min(0.65, 0.2 + ((m - 1.0) / 2.0) * 0.45);
}
function surgeLevel(m) {
  if (m < 1.2) return '正常';
  if (m < 1.5) return '輕微';
  if (m < 1.8) return '中等';
  if (m < 2.2) return '較高';
  if (m < 2.6) return '高';
  return '極高';
}

// ── Surge simulation ──────────────────────────────────────────────────────────
function rushHourFactor(t) {
  const h = t.getHours() + t.getMinutes() / 60;
  if (h >= 7 && h <= 9.5) return 1.0 + 0.8 * Math.exp(-Math.pow(h - 8.25, 2) / 0.8);
  if (h >= 17 && h <= 20)  return 1.0 + 1.0 * Math.exp(-Math.pow(h - 18.5, 2) / 1.0);
  if (h >= 2  && h < 6)    return 0.3;
  return 0.7;
}
function nightlifeFactor(id, t) {
  const h = t.getHours() + t.getMinutes() / 60;
  const isWeekend = t.getDay() === 5 || t.getDay() === 6;
  if (id === 'central_western' || id === 'wan_chai') {
    if (isWeekend && (h >= 22 || h < 3)) return 1.8;
    if (h >= 22 || h < 3) return 1.3;
  }
  return 1.0;
}
function airportFactor(id, t) {
  if (id !== 'islands') return 1.0;
  const h = t.getHours();
  if (h >= 6  && h <= 10) return 1.4;
  if (h >= 18 && h <= 23) return 1.5;
  return 1.1;
}
function demandToMultiplier(d) { return 1.0 + d * d * 2.0; }

function generateMultiplier(id) {
  const base = BASE_DEMAND[id] || 0.5;
  const now  = new Date();
  let d = base * rushHourFactor(now) * nightlifeFactor(id, now) * airportFactor(id, now);
  d *= 0.85 + Math.random() * 0.30;
  return Math.round(demandToMultiplier(Math.min(1, d)) * 10) / 10;
}

// ── Map setup ─────────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl:false, attributionControl:true })
  .setView([22.35, 114.15], 11);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19,
}).addTo(map);

// ── State ─────────────────────────────────────────────────────────────────────
let refreshInterval = 15;
let refreshTimer    = null;
let selectedId      = null;
const polygonLayers = {};
const labelMarkers  = {};
const surgeData     = {};

// ── Build district layers ─────────────────────────────────────────────────────
DISTRICTS.forEach(d => {
  const poly = L.polygon(d.poly, {
    fillColor: '#4CAF50', fillOpacity: 0.15,
    color: '#4CAF50', weight: 1, opacity: 0.6,
    interactive: true,
  }).addTo(map);

  poly.on('click', () => selectDistrict(d.id));
  polygonLayers[d.id] = poly;

  const icon = L.divIcon({
    className: '',
    html: `<div class="label-chip" id="label-${d.id}">1.0x</div>`,
    iconSize: [64, 28],
    iconAnchor: [32, 14],
  });
  const marker = L.marker(d.center, { icon, interactive: true }).addTo(map);
  marker.on('click', () => selectDistrict(d.id));
  labelMarkers[d.id] = marker;
});

// Label chip styles injected once
const style = document.createElement('style');
style.textContent = `
  .label-chip {
    background: rgba(0,0,0,0.68);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 3px 8px;
    font-size: 12px;
    font-weight: 700;
    color: #4CAF50;
    text-align: center;
    white-space: nowrap;
    cursor: pointer;
    transition: border-color 0.2s;
  }
`;
document.head.appendChild(style);

// ── Data source: surge.json on same origin (GitHub Pages) ────────────────────
// scraper.js pushes surge.json to gh-pages every 60s via GitHub API
const API_URL = '/surge.json';
let usingLiveData = false;
let pollTimer = null;

async function fetchLiveSurge() {
  try {
    // Cache-bust so GitHub Pages serves the latest file, not a cached copy
    const resp = await fetch(API_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return await resp.json();
  } catch (e) {
    return null;
  }
}

function applyLiveData(apiResp) {
  const liveCount = Object.values(apiResp.data || {})
    .filter(d => d.multiplier !== null && d.source !== 'error').length;

  DISTRICTS.forEach(d => {
    const entry = (apiResp.data || {})[d.id];
    let m;
    if (entry && entry.multiplier !== null) {
      m = entry.multiplier;
      usingLiveData = true;
    } else {
      // Fallback to simulation for this district
      m = generateMultiplier(d.id);
    }
    surgeData[d.id] = m;
    updateDistrictVisual(d.id, m);
  });

  if (selectedId) showDetail(selectedId);

  // Update timestamp
  const src = apiResp.updatedAt ? new Date(apiResp.updatedAt) : new Date();
  const ts = `${pad(src.getHours())}:${pad(src.getMinutes())}:${pad(src.getSeconds())}`;
  document.getElementById('timestamp').textContent = `上次更新: ${ts}`;

  // Update source badge
  updateSourceBadge(apiResp, liveCount);

  // surge.json is a static file — no live progress bar needed
  document.getElementById('progress-bar-wrap').style.display = 'none';
}

function updateSourceBadge(apiResp, liveCount) {
  const badge = document.getElementById('source-badge');
  const dot   = document.getElementById('src-dot');
  const label = document.getElementById('src-label');

  badge.classList.remove('live', 'sim', 'err');
  dot.classList.remove('live', 'sim', 'err');

  if (!apiResp || apiResp.status === 'error') {
    badge.classList.add('err'); dot.classList.add('err');
    label.textContent = '爬取失敗 · 模擬數據';
  } else if (liveCount >= 10) {
    badge.classList.add('live'); dot.classList.add('live');
    label.textContent = `uber.com 實時 · ${liveCount}/${DISTRICTS.length} 個區`;
  } else if (liveCount > 0) {
    badge.classList.add('sim'); dot.classList.add('sim');
    label.textContent = `部分實時 (${liveCount}區) · 其餘模擬`;
  } else {
    badge.classList.add('sim'); dot.classList.add('sim');
    label.textContent = '模擬數據 · 請啟動 scraper.js';
  }
}

function updateDistrictVisual(id, m) {
  const color = surgeColor(m);
  const opac  = surgeOpacity(m);
  const isSelected = selectedId === id;

  polygonLayers[id].setStyle({
    fillColor: color, fillOpacity: opac,
    color: isSelected ? '#fff' : color,
    weight: isSelected ? 2.5 : 1,
    opacity: isSelected ? 1 : 0.65,
  });

  const el = document.getElementById(`label-${id}`);
  if (el) {
    el.textContent = m.toFixed(1) + 'x';
    el.style.color = color;
    el.style.borderColor = color + 'aa';
  }
}

// ── Refresh logic ─────────────────────────────────────────────────────────────
async function refresh() {
  setLoading(true);

  const apiResp = await fetchLiveSurge();

  if (apiResp) {
    applyLiveData(apiResp);
  } else {
    // No backend → pure simulation fallback
    DISTRICTS.forEach(d => {
      const m = generateMultiplier(d.id);
      surgeData[d.id] = m;
      updateDistrictVisual(d.id, m);
    });
    if (selectedId) showDetail(selectedId);
    const now = new Date();
    const ts = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    document.getElementById('timestamp').textContent = `上次更新: ${ts}`;

    // Show sim badge
    const badge = document.getElementById('source-badge');
    const dot   = document.getElementById('src-dot');
    badge.className = 'sim'; dot.className = 'src-dot sim';
    document.getElementById('src-label').textContent = '模擬數據（無後端）';
  }

  setLoading(false);
}

function setLoading(on) {
  const icon = document.getElementById('refresh-icon');
  icon.innerHTML = on ? '<div class="spinner"></div>' : '↻';
}

function forceRefresh() { refresh(); }

// Poll every 10s to catch backend scrape progress in real-time
// (actual data only changes every 60s, but we show progress updates)
function startTimer() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refresh, 10 * 1000);
}

function setRefreshInterval(secs) {
  // Note: the server always scrapes every 60s; this setting is kept for UX
  refreshInterval = secs;
  document.getElementById('refresh-label').textContent = `每60秒更新`;
  document.querySelectorAll('.interval-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.secs) === secs);
  });
}

// ── District selection ────────────────────────────────────────────────────────
function selectDistrict(id) {
  // Deselect previous
  if (selectedId && selectedId !== id) {
    const m = surgeData[selectedId] || 1.0;
    polygonLayers[selectedId].setStyle({
      color: surgeColor(m), weight: 1, opacity: 0.65,
    });
  }
  if (selectedId === id) {
    closeDetail();
    return;
  }
  selectedId = id;
  const m = surgeData[id] || 1.0;
  polygonLayers[id].setStyle({
    color: '#fff', weight: 2.5, opacity: 1,
  });
  showDetail(id);
}

function showDetail(id) {
  const d = DISTRICTS.find(x => x.id === id);
  if (!d) return;
  const m = surgeData[id] || 1.0;
  const color = surgeColor(m);

  document.getElementById('card-cn').textContent = d.cn;
  document.getElementById('card-en').textContent = d.en;
  document.getElementById('card-multiplier').textContent = m.toFixed(1) + 'x';

  const circle = document.getElementById('card-circle');
  circle.style.borderColor = color;
  circle.style.background = color + '22';
  circle.querySelector('span').style.color = color;

  const badge = document.getElementById('card-badge');
  badge.textContent = surgeLevel(m);
  badge.style.background = color + '33';
  badge.style.color = color;

  document.getElementById('card-inner').style.borderColor = color + '99';
  document.getElementById('card-inner').style.boxShadow = `0 0 24px ${color}33`;

  document.getElementById('detail-card').classList.add('visible');
}

function closeDetail() {
  if (selectedId) {
    const m = surgeData[selectedId] || 1.0;
    polygonLayers[selectedId].setStyle({
      color: surgeColor(m), weight: 1, opacity: 0.65,
    });
  }
  selectedId = null;
  document.getElementById('detail-card').classList.remove('visible');
}

// Close detail when clicking map background
map.on('click', closeDetail);

// ── Settings ──────────────────────────────────────────────────────────────────
function openSettings() {
  document.getElementById('settings-overlay').classList.add('open');
}
function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('open');
}
function closeSettingsOutside(e) {
  if (e.target === document.getElementById('settings-overlay')) closeSettings();
}

// Build interval buttons
const intervals = [5, 10, 15, 30, 60];
const container = document.getElementById('interval-options');
intervals.forEach(s => {
  const btn = document.createElement('button');
  btn.className = 'interval-btn' + (s === 15 ? ' active' : '');
  btn.dataset.secs = s;
  btn.textContent = s < 60 ? `${s}秒` : '1分鐘';
  btn.onclick = () => { setRefreshInterval(s); closeSettings(); };
  container.appendChild(btn);
});

// ── Helpers ───────────────────────────────────────────────────────────────────
function pad(n) { return String(n).padStart(2, '0'); }

// ── Boot ──────────────────────────────────────────────────────────────────────
refresh();
startTimer();
// Also poll every 10s to reflect live scrape progress
setInterval(refresh, 10000);
</script>
</body>
</html>
